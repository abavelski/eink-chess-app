name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - name: Test
        run: cargo test
      - name: Format
        run: cargo fmt --all -- --check

  cobalt-range-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: actions/checkout@v4
        with:
          repository: abavelski/Cobalt
          ref: ff4ec9950e178243807082bf818e42c8538d080e
          path: cobalt
      - name: Patch pinned Cobalt idempotently
        run: |
          python3 -m py_compile scripts/cobalt_collection_range.py scripts/prepare_cobalt.py
          python3 - <<'PY'
          from pathlib import Path
          from scripts.cobalt_collection_range import install
          for _ in range(2):
              install(Path("cobalt"))
          PY
      - name: Test actual Cobalt range provider and host simulator
        run: |
          cargo test --manifest-path cobalt/Cargo.toml -p kobo-policy eink_chess_collection_range
          cargo test --manifest-path cobalt/Cargo.toml -p kobod --bin kobod
          cargo check --manifest-path cobalt/Cargo.toml -p kobod --features device-write
